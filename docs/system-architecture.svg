<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="962" viewBox="0 0 1000 962" role="img" aria-labelledby="title desc">
  <title id="title">CyberMorph system architecture</title>
  <desc id="desc">Players use the offline Android game and the Vue dashboard. Educators and Admins use the dashboard for their role-specific features. The game runs its AI on-device. The planned storage flow saves sessions in SQLite before queuing them for sync. An external training pipeline supplies frozen weights. The dashboard and the game's sync queue connect to FastAPI, which enforces authentication and role-based access and connects to cloud PostgreSQL.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#171717"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #171717; font-size: 20px; }
      .title { font-size: 30px; font-weight: 700; }
      .heading { font-size: 22px; font-weight: 700; }
      .note { font-size: 17px; }
      .box { fill: white; stroke: #171717; stroke-width: 1.6; }
      .line { fill: none; stroke: #171717; stroke-width: 1.6; }
      .arrow { marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="1000" height="962" fill="white"/>
  <text class="title" text-anchor="middle" x="500" y="50">CyberMorph system architecture</text>

  <!-- User roles and shared dashboard entry -->
  <rect class="box" x="120" y="84" width="180" height="44"/>
  <text text-anchor="middle" x="210" y="113">Player</text>
  <rect class="box" x="120" y="144" width="180" height="44"/>
  <text text-anchor="middle" x="210" y="173">Educator</text>
  <rect class="box" x="120" y="204" width="180" height="44"/>
  <text text-anchor="middle" x="210" y="233">Admin</text>
  <path class="line" d="M300 106 H542 V226 M300 166 H542 M300 226 H542"/>
  <path class="line arrow" d="M542 226 H723 V266"/>

  <!-- Offline game and local storage -->
  <path class="line arrow dashed" d="M120 106 H44 V358 H76"/>
  <text class="note" text-anchor="start" x="56" y="280">Offline play</text>
  <rect class="box" x="76" y="330" width="200" height="56"/>
  <text class="heading" text-anchor="middle" x="176" y="354">Godot game</text>
  <text class="note" text-anchor="middle" x="176" y="375">Android</text>
  <path class="line arrow" d="M176 386 V412"/>
  <rect class="box" x="76" y="412" width="200" height="56"/>
  <text text-anchor="middle" x="176" y="447">On-device AI</text>
  <path class="line arrow" d="M176 468 V494"/>
  <rect class="box" x="76" y="494" width="200" height="56"/>
  <text text-anchor="middle" x="176" y="529">Game session</text>
  <path class="line arrow dashed" d="M176 550 V582"/>
  <rect class="box dashed" x="76" y="582" width="200" height="62"/>
  <text text-anchor="middle" x="176" y="608">SQLite</text>
  <text class="note" text-anchor="middle" x="176" y="630">(planned design)</text>
  <path class="line arrow dashed" d="M176 644 V682"/>
  <rect class="box" x="76" y="682" width="200" height="56"/>
  <text text-anchor="middle" x="176" y="717">Pending sync queue</text>

  <rect class="box dashed" x="410" y="412" width="144" height="56"/>
  <text text-anchor="middle" x="482" y="437">AI training</text>
  <text class="note" text-anchor="middle" x="482" y="457">Developer PC</text>
  <path class="line arrow dashed" d="M410 440 H276"/>
  <text class="note" text-anchor="middle" x="343" y="428">Frozen weights</text>

  <!-- Role-specific dashboard features -->
  <rect class="box" x="566" y="266" width="314" height="60"/>
  <text class="heading" text-anchor="middle" x="723" y="303">Vue dashboard</text>
  <path class="line" d="M723 326 V350 H895 M723 350 H576"/>
  <path class="line arrow" d="M576 350 V368"/>
  <path class="line arrow" d="M735 350 V368"/>
  <path class="line arrow" d="M895 350 V368"/>

  <rect class="box" x="500" y="368" width="152" height="40"/>
  <text text-anchor="middle" x="576" y="394">Player progress</text>
  <rect class="box" x="660" y="368" width="150" height="40"/>
  <text class="heading" text-anchor="middle" x="735" y="395">Educator</text>
  <rect class="box" x="820" y="368" width="150" height="40"/>
  <text class="heading" text-anchor="middle" x="895" y="395">Admin</text>

  <path class="line" d="M735 408 V426 H648 V539"/>
  <path class="line arrow" d="M648 465 H660"/>
  <path class="line arrow" d="M648 539 H660"/>
  <rect class="box" x="660" y="438" width="150" height="54"/>
  <text text-anchor="middle" x="735" y="460">
    <tspan x="735">Classroom</tspan><tspan x="735" dy="22">codes</tspan>
  </text>
  <rect class="box" x="660" y="512" width="150" height="54"/>
  <text text-anchor="middle" x="735" y="534">
    <tspan x="735">Student</tspan><tspan x="735" dy="22">progress</tspan>
  </text>

  <path class="line" d="M895 408 V426 H975 V613"/>
  <path class="line arrow" d="M975 465 H964"/>
  <path class="line arrow" d="M975 539 H964"/>
  <path class="line arrow" d="M975 613 H964"/>
  <rect class="box" x="824" y="438" width="140" height="54"/>
  <text text-anchor="middle" x="894" y="460">
    <tspan x="894">Classroom</tspan><tspan x="894" dy="22">management</tspan>
  </text>
  <rect class="box" x="824" y="512" width="140" height="54"/>
  <text text-anchor="middle" x="894" y="534">
    <tspan x="894">User</tspan><tspan x="894" dy="22">management</tspan>
  </text>
  <rect class="box" x="824" y="586" width="140" height="54"/>
  <text text-anchor="middle" x="894" y="620">Audit logs</text>

  <!-- Online clients connect to FastAPI, which accesses PostgreSQL -->
  <path class="line arrow" d="M276 710 H414 V752 H554"/>
  <text class="note" text-anchor="middle" x="484" y="739">Online sync</text>
  <path class="line arrow" d="M880 296 H988 V752 H892"/>
  <rect class="box" x="554" y="710" width="338" height="86"/>
  <text class="heading" text-anchor="middle" x="723" y="745">FastAPI cloud API</text>
  <text class="note" text-anchor="middle" x="723" y="774">Authentication · Role-based access</text>

  <path class="line arrow" d="M723 796 V837"/>
  <path class="box" d="M613 856 C613 830 833 830 833 856 V914 C833 940 613 940 613 914 Z"/>
  <path class="line" d="M613 856 C613 882 833 882 833 856"/>
  <text class="heading" text-anchor="middle" x="723" y="896">PostgreSQL</text>
  <text class="note" text-anchor="middle" x="723" y="919">Cloud database</text>
</svg>
